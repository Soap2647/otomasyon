[project]
name = "otomasyon"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mert Yasin Yılmaz", email = "Mertyasinyilmaz26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arduino-router-bridge>=0.5.2",
    "feedparser>=6.0.14",
    "icalendar>=7.3.0",
    "python-telegram-bot[job-queue]>=22.8",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
otomasyon = "otomasyon:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
